name: Contribution snake

# Redraws the contribution graph as an animated snake (light + dark) into the `output` branch.
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?palette=github-light&color_snake=#1d4ed8&color_dots=#ebedf0,#c7d2fe,#93a8e8,#4f6fd8,#1d4ed8
            dist/snake-dark.svg?palette=github-dark&color_snake=#8ab4ff&color_dots=#161b22,#1e2a4a,#2f4a8a,#5b82d6,#8ab4ff
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
